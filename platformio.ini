; PlatformIO Project Configuration File
; Drone Quadcopter Flight Controller (Arduino Uno / ATmega328P)

[platformio]
default_envs = uno
src_dir = code/src
include_dir = code/include

[common]
porta = /dev/ttyUSB0

[env:uno]
platform = atmelavr
board = uno
framework = arduino
upload_port = ${common.porta}
monitor_port = ${common.porta}
monitor_speed = 57600
build_src_filter = +<main.cpp>

[env:i2c_finder]
platform = atmelavr
board = uno
framework = arduino
upload_port = ${common.porta}
monitor_port = ${common.porta}
monitor_speed = 57600
build_src_filter = +<i2c_finder.cpp>
