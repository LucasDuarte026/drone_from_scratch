; PlatformIO Project Configuration File
; Drone Quadcopter Flight Controller (Arduino Uno / ATmega328P)

[platformio]
default_envs = uno
src_dir = code/src
include_dir = code/include

[env:uno]
platform = atmelavr
board = uno
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 57600

[env:stage1_imu]
platform = atmelavr
board = uno
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 57600

